<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch & Earn</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">
      💰 Watch<span>&Earn</span>
    </div>

    <button
      id="loginBtn"
      onclick="document.getElementById('authBox').style.display='block';"
    >
      Login
    </button>
  </header>

  <main>

    <section class="hero">
      <h1>Watch Videos & Earn Coins</h1>

      <p>
        Watch videos, collect coins and earn rewards.
      </p>

      <button id="startBtn">
        Start Earning
      </button>
    </section>

    <!-- LOGIN / SIGN UP -->
    <section id="authBox" style="display:none;">

      <h2>Login / Sign Up</h2>

      <input
        type="email"
        id="emailInput"
        placeholder="Email"
      >

      <input
        type="password"
        id="passwordInput"
        placeholder="Password"
      >

      <button id="signupBtn">
        Sign Up
      </button>

      <button id="emailLoginBtn">
        Login
      </button>

      <p id="authMessage"></p>

    </section>

    <!-- STATS -->
    <section class="stats">

      <div class="card">
        <h2 id="points">🪙 0</h2>
        <p>Your Coins</p>
      </div>

      <div class="card">
        <h2 id="videosWatched">🎬 0</h2>
        <p>Videos Watched</p>
      </div>

      <div class="card">
        <h2 id="earnings">💵 $0.00</h2>
        <p>Your Earnings</p>
      </div>

    </section>

    <!-- VIDEOS -->
    <section class="videos">

      <h2>Available Videos</h2>

      <div id="videos"></div>

    </section>

  </main>

  <footer>
    <p>© 2026 Watch & Earn. All Rights Reserved.</p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
