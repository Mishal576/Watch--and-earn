<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch & Earn</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">
      💰 Watch<span>&Earn</span>
    </div>

    <button id="loginBtn">Login</button>
  </header>

  <main>

    <section class="hero">
      <h1>Watch Videos & Earn Coins</h1>

      <p>
        Watch videos, collect coins and earn rewards.
      </p>

      <button id="startBtn">
        Start Earning
      </button>
    </section>

    <section class="stats">

      <div class="card">
        <h2>🪙 0</h2>
        <p>Your Coins</p>
      </div>

      <div class="card">
        <h2>🎬 0</h2>
        <p>Videos Watched</p>
      </div>

      <div class="card">
        <h2>💵 $0.00</h2>
        <p>Your Earnings</p>
      </div>

    </section>

    <section class="videos">

      <h2>Available Videos</h2>

      <div class="video-card">

        <div class="video-thumbnail">
          ▶️
        </div>

        <div class="video-info">
          <h3>Watch & Earn Video</h3>
          <p>Watch this video and earn coins.</p>

          <button class="watchBtn">
            Watch Video
          </button>
        </div>

      </div>

    </section>

  </main>

  <footer>
    <p>© 2026 Watch & Earn. All Rights Reserved.</p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
